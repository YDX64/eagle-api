name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /root/football-analysis-api
            # Clean untracked files that block git pull
            rm -f gunicorn.pid
            git fetch origin
            git reset --hard origin/main
            # Kill any stuck processes on port 8000 before restart
            fuser -k 8000/tcp 2>/dev/null || true
            sleep 2
            systemctl restart golsinyali-api
            sleep 3
            systemctl status golsinyali-api --no-pager | head -5
            echo "Deployed commit: $(git log -1 --oneline)"
            curl -s http://localhost:8000/api/v1/health
# Auto-deploy test: Sat Dec 27 19:31:01 +03 2025
