components:
  # ============================================================================
  # HEADERS
  # ============================================================================
  headers:
    X-RateLimit-Limit:
      description: Maximum number of requests allowed per minute
      schema:
        type: integer
        example: 200
    X-RateLimit-Remaining:
      description: Number of requests remaining in current rate limit window
      schema:
        type: integer
        example: 195
    X-RateLimit-Reset:
      description: Unix timestamp (UTC) when the rate limit window resets
      schema:
        type: integer
        example: 1708340460
    Retry-After:
      description: Number of seconds to wait before retrying (for 429 and 503 responses)
      schema:
        type: integer
        example: 60
    X-Cache-TTL:
      description: Cache time-to-live in seconds for this response
      schema:
        type: integer
        example: 300

  # ============================================================================
  # SCHEMAS
  # ============================================================================
  schemas:
    # Base Response
    SuccessResponse:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: string
          format: date-time
          example: "2026-02-19T10:00:00Z"
        data:
          type: object

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Resource not found"
        status_code:
          type: integer
          example: 404
        timestamp:
          type: string
          format: date-time
          example: "2026-02-19T10:00:00Z"

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                message:
                  type: string
                  example: "Operation completed successfully"
                timestamp:
                  type: string
                  format: date-time

    # ---- Match Models ----
    Match:
      type: object
      properties:
        match_id:
          type: integer
          example: 2804405
        home_team:
          type: string
          example: "Arsenal"
        away_team:
          type: string
          example: "Chelsea"
        home_team_id:
          type: integer
          example: 1234
        away_team_id:
          type: integer
          example: 5678
        home_score:
          type: integer
          nullable: true
          example: 2
          description: null when match is scheduled
        away_score:
          type: integer
          nullable: true
          example: 1
          description: null when match is scheduled
        match_time:
          type: string
          format: date-time
          example: "2026-02-19T20:00:00Z"
        status:
          type: string
          enum: [scheduled, 1H, HT, 2H, ET, PEN, finished, postponed, cancelled, abandoned]
          example: "finished"
          description: |
            Match status codes:
            - `scheduled`: Not yet started
            - `1H`: First half in progress
            - `HT`: Half time
            - `2H`: Second half in progress
            - `ET`: Extra time
            - `PEN`: Penalty shootout
            - `finished`: Match ended
            - `postponed`: Match postponed
            - `cancelled`: Match cancelled
            - `abandoned`: Match abandoned
        league_id:
          type: integer
          example: 1
        league_name:
          type: string
          example: "England Premier League"

    MatchDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Match'
                - type: object
                  properties:
                    analysis:
                      type: object
                      description: Pre-computed analysis results (H2H summary, form, predictions)
                      properties:
                        h2h_summary:
                          type: object
                        home_form:
                          type: string
                          example: "WWDLW"
                        away_form:
                          type: string
                          example: "WDLWL"
                        prediction:
                          type: object

    DateMatchesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: "2026-02-19"
                total_matches:
                  type: integer
                  example: 42
                matches:
                  type: array
                  items:
                    $ref: '#/components/schemas/Match'
                leagues:
                  type: object
                  description: Map of league_id → league info with match count
                  additionalProperties:
                    type: object
                    properties:
                      league_name:
                        type: string
                      league_code:
                        type: string
                      match_count:
                        type: integer

    H2HResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                match_id:
                  type: integer
                  example: 2804405
                h2h_details:
                  type: object
                  description: Raw H2H data from data source
                  properties:
                    head_to_head:
                      type: array
                      items:
