          type: string
          description: JWT Bearer token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhcGlfdXNlciIsImV4cCI6MTcwODM0NDQ2MH0.abc123"
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Token expiry in seconds
          example: 3600

  # ============================================================================
  # RESPONSES (Reusable)
  # ============================================================================
  responses:
    BadRequest:
      description: Bad Request — missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Missing required parameter: season"
            status_code: 400

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Match 9999999 not found"
            status_code: 404

    Unauthorized:
      description: Unauthorized — valid authentication required
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Authentication scheme
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Authentication required"
            status_code: 401

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Rate limit exceeded. Try again in 60 seconds."
            status_code: 429

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "An unexpected error occurred"
            status_code: 500

    ServiceUnavailable:
      description: Service temporarily unavailable (all data sources failed)
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Service temporarily unavailable. Please retry in 60 seconds."
            status_code: 503

  # ============================================================================
  # SECURITY SCHEMES
  # ============================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from `POST /auth/token`.
        Include as: `Authorization: Bearer <token>`
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for direct authentication.
        Include as: `X-API-Key: <your-key>`
