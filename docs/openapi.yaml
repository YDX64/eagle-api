  # ============================================================================
  # HEALTH & ADMIN ENDPOINTS
  # ============================================================================
  /health:
    get:
      tags:
        - Health
      summary: Basic health check
      description: Lightweight liveness probe. No auth required. Used by load balancers.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                timestamp: "2026-02-19T10:00:00Z"
                version: "1.0.0"

  /health/detailed:
    get:
      tags:
        - Health
      summary: Detailed health check
      description: |
        Returns detailed service status including cache health and background tasks.
        No auth required.
      operationId: detailedHealthCheck
      responses:
        '200':
          description: Detailed health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedHealthResponse'
              example:
                status: healthy
                timestamp: "2026-02-19T10:00:00Z"
                version: "1.0.0"
                cache: "enabled"
                cache_info:
                  type: "redis"
                  timeout: 1800
                session: "managed by http_client"
                background_tasks:
                  cache_cleanup:
                    last_run: "2026-02-19T09:00:00Z"
                    next_run: "2026-02-19T10:00:00Z"
                  is_leader: true

  /cache/status:
    get:
      tags:
        - Health
      summary: Cache configuration status
      description: Returns current cache configuration (type, Redis host/port, default TTL).
      operationId: getCacheStatus
      responses:
        '200':
          description: Cache configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatusResponse'

  /cache/stats:
    get:
      tags:
        - Health
      summary: Cache performance statistics
      description: |
        Returns cache performance metrics:
        - `hits` / `misses`: Raw counts
        - `hit_rate`: Percentage served from cache
        - `stale_served`: Times stale data was served (before background refresh)
        - `background_refreshes`: Async refresh operations started
        - `refresh_failures`: Failed background refreshes
        - `dedup_hits`: Duplicate requests collapsed (prevented N upstream calls)
        - `active_background_refreshes`: Currently running background refreshes
      operationId: getCacheStats
      responses:
        '200':
          description: Cache performance metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
              example:
                success: true
                data:
                  hits: 15420
                  misses: 890
                  hit_rate: 94.5
                  stale_served: 230
                  background_refreshes: 445
                  refresh_failures: 3
                  dedup_hits: 67
                  active_background_refreshes: 2
                  timestamp: "2026-02-19T10:00:00Z"

  /cache/clear:
    post:
      tags:
        - Health
      summary: Clear all cache
      description: |
        Clears all cached data. Forces fresh data fetch on next requests.

        **Warning:** This will cause a temporary increase in response times and upstream load.

        **Recommended auth:** API Key or JWT (currently unenforced — planned fix).
      operationId: clearCache
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: "Cache başarıyla temizlendi"
                  timestamp: "2026-02-19T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cache/stats/reset:
    post:
      tags:
        - Health
      summary: Reset cache statistics counters
      description: Resets all cache statistics counters to zero. Useful for monitoring baseline measurements.
      operationId: resetCacheStats
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Stats reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sources/health:
    get:
      tags:
        - Health
      summary: Data source health metrics
      description: |
        Health metrics for all configured data sources:
        - Request count, success/failure counts
        - Error rate and consecutive failures
        - Last error type and timestamp
        - Priority score (higher = preferred)
        - Whether this source is currently primary

        Useful for monitoring the multi-source failover system.
      operationId: getSourcesHealth
      responses:
        '200':
          description: Source health metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesHealthResponse'
              example:
                success: true
                data:
                  summary:
                    total_requests: 58420
                    total_failures: 145
                    overall_error_rate: 0.0025
                    primary_source: "https://live3.nowgoal26.com"
                    total_sources: 3
                  timestamp: "2026-02-19T10:00:00Z"
                  sources:
                    "https://live3.nowgoal26.com":
                      is_primary: true
                      total_requests: 48200
                      successful_requests: 48090
                      failed_requests: 110
                      error_rate: 0.0023
                      consecutive_failures: 0
                      priority_score: 0.98
                      last_error: null

  /sources/force-primary:
    post:
      tags:
        - Health
      summary: Force primary data source
      description: |
        Manually override the primary data source selection.
        Useful for testing or emergency failover.

        **Requires auth.**
      operationId: forcePrimarySource
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_url
              properties:
                source_url:
                  type: string
                  format: uri
                  description: Full URL of the source to force as primary
                  example: "https://www.goaloo.com"
            example:
              source_url: "https://www.goaloo.com"
      responses:
        '200':
          description: Primary source changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing or invalid source_url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sources/reset-metrics:
    post:
      tags:
        - Health
      summary: Reset source health metrics
      description: |
        Resets health metrics for one or all data sources.
        When `source_url` is omitted, resets ALL sources.

        **Requires auth.**
      operationId: resetSourceMetrics
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source_url:
                  type: string
                  format: uri
                  description: Specific source to reset. Omit to reset all sources.
                  example: "https://www.nowgoal.com"
            example:
              source_url: "https://www.nowgoal.com"
      responses:
        '200':
          description: Metrics reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  /auth/token:
    post:
      tags:
        - Authentication
      summary: Generate JWT token
      description: |
        Exchange an API key for a short-lived JWT Bearer token (1 hour).

        The token can then be used in the `Authorization: Bearer <token>` header.

        API keys are configured via the `API_SECRET_KEY` environment variable.
      operationId: generateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
              properties:
                api_key:
                  type: string
                  description: Your API secret key
                  example: "your-api-secret-key"
            example:
              api_key: "your-api-secret-key"
      responses:
        '200':
          description: JWT token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: "Bearer"
                expires_in: 3600
        '400':
          description: API key missing from request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "API key is required"
                status_code: 400
                success: false
        '403':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid API key"
                status_code: 403
                success: false

