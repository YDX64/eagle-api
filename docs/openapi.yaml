        - name: sub_league_id
          in: query
          required: false
          description: Sub-league/group ID (for leagues with groups or conferences)
          schema:
            type: integer
      responses:
        '200':
          description: League standings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsResponse'
              example:
                success: true
                data:
                  league:
                    id: 36
                    name: "Turkey Super Lig"
                    season: "2024-2025"
                  standings_type: "overall"
                  teams_count: 19
                  standings:
                    - position: 1
                      team_id: 1234
                      team_name: "Galatasaray"
                      played: 22
                      won: 16
                      drawn: 4
                      lost: 2
                      goals_for: 52
                      goals_against: 18
                      goal_difference: 34
                      points: 52
