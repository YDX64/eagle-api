                success: true
                data:
                  league_id: 36
                  code: "super-lig"
                  name: "Turkey Super Lig"
                  type: "league"
                  country: "turkey"
                  has_subleague: false
                  is_cup: false
                  current_season: "2024-2025"
                  available_seasons:
                    - "2024-2025"
                    - "2023-2024"
                    - "2022-2023"
        '429':
