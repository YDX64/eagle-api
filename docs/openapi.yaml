openapi: 3.0.3
info:
  title: Golsinyali Football API
  description: |
    High-performance football match data API with multi-source failover, intelligent caching, and comprehensive analysis features.

    ## Features
    - **Multi-Source Failover:** Primary (nowgoal26.com) → Fallback (nowgoal.com → goaloo.com)
    - **Hybrid Caching:** Redis primary + in-memory fallback with stale-while-revalidate
    - **Real-Time Data:** Live match data refreshed every 30 seconds
    - **Comprehensive Analysis:** H2H, odds, predictions, team performance, tactics

    ## Rate Limiting
    - **200 requests/minute** per IP
    - **3000 requests/hour** per IP
    - Rate limit headers returned on every response:
      - `X-RateLimit-Limit`: Request limit per window
      - `X-RateLimit-Remaining`: Remaining requests in current window
      - `X-RateLimit-Reset`: Unix timestamp when window resets
    - On limit exceeded: HTTP 429 with `Retry-After` header

    ## Authentication
    Two authentication methods are supported:

    **JWT Bearer Token** (recommended):
    ```
    POST /api/v1/auth/token  →  {"access_token": "...", "token_type": "Bearer"}
    Authorization: Bearer <token>
    ```

    **API Key** (header):
    ```
    X-API-Key: <your-api-key>
    ```

    Most read endpoints are public. Admin endpoints (cache clear, source management) require authentication.

    ## Caching
    All responses include cache metadata. TTLs by data type:
    | Data Type | TTL |
    |-----------|-----|
    | Live matches | 30 seconds |
    | Live odds | 15 seconds |
    | Match details (live) | 60 seconds |
    | Match details (finished) | 24 hours |
    | H2H data | 24 hours |
    | Odds data | 15 minutes |
    | League standings | 12 hours |
    | League matches | 48 hours |
    | Player stats | 24 hours |

    ## Error Format
    All errors return JSON:
    ```json
    {
      "error": "Human-readable message",
      "status_code": 404,
      "success": false,
      "timestamp": "2026-02-19T10:00:00Z"
    }
    ```

  version: 1.0.0
  contact:
    name: Golsinyali API Support
    email: api@golsinyali.com
  license:
    name: Proprietary
    url: https://golsinyali.com/terms

servers:
  - url: https://api.golsinyali.com/api/v1
    description: Production server
  - url: http://localhost:8000/api/v1
    description: Development server

tags:
  - name: Matches
    description: |
      Match data endpoints. Returns scheduled, live and finished match information.
      Cache TTL varies by match status: live (60s), future (5min), finished (24h).
  - name: Live
    description: |
      Real-time live match data updated every 30 seconds.
      Includes stats, odds (Bet365), corners, and events.
  - name: Leagues
    description: |
      League list and metadata endpoints. League data loaded from static JSON file
      (`data/leagues.json`) — no upstream call required.
  - name: League Data
    description: |
      Detailed league data: standings, fixtures, team stats, player stats, handicap stats.
      Data fetched from football.nowgoal26.com with long cache TTLs (12-48 hours).
  - name: Health
    description: |
      Health check and monitoring endpoints.
      Admin endpoints (cache/clear, sources/force-primary) require authentication.
  - name: Authentication
    description: Generate JWT tokens for API access.

paths:
  # ============================================================================
  # MATCH ENDPOINTS
  # ============================================================================
  /match/{match_id}:
    get:
      tags:
        - Matches
      summary: Get match details
      description: |
        Get comprehensive match details including team info, statistics and analysis.

        **Note:** Heavy raw data (H2H details, raw odds) are excluded from this response.
        Use `/match/{match_id}/h2h` for detailed H2H data.
        Use `/match/{match_id}/odds` for detailed odds data.

        **Cache TTL:**
        - Live match: 60 seconds
        - Finished match: 24 hours
        - Scheduled match: 5 minutes
      operationId: getMatchDetails
      x-cache-ttl:
        live: 60
        finished: 86400
        scheduled: 300
      parameters:
        - name: match_id
          in: path
          required: true
          description: Unique match identifier
          schema:
            type: integer
            example: 2804405
        - name: fields
          in: query
          required: false
          description: |
            Comma-separated list of fields to return. When omitted, all fields are returned.
            Example: `match_id,home_team,away_team,home_score,away_score`
          schema:
            type: string
            example: "match_id,home_team,away_team"
      responses:
        '200':
          description: Match details retrieved successfully
          headers:
            X-Cache-TTL:
              description: Cache TTL in seconds
              schema:
                type: integer
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetailsResponse'
              example:
                success: true
                timestamp: "2026-02-19T10:00:00Z"
                data:
                  match_id: 2804405
                  home_team: "Galatasaray"
                  away_team: "Fenerbahce"
                  home_team_id: 1234
                  away_team_id: 5678
                  home_score: 2
                  away_score: 1
                  match_time: "2026-02-19T19:00:00Z"
                  status: "finished"
                  league_id: 36
                  league_name: "Turkey Super Lig"
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /match/{match_id}/h2h:
    get:
      tags:
        - Matches
      summary: Get match H2H details
      description: |
        Get detailed Head-to-Head information including:
        - Head-to-head match history (last 10 meetings)
        - Home team previous matches (last 5)
        - Away team previous matches (last 5)
        - Team standings in current league
        - Injuries and suspensions
        - Last match lineups

        **Cache TTL:** 24 hours (H2H data is stable)
      operationId: getMatchH2H
      x-cache-ttl: 86400
      parameters:
        - name: match_id
          in: path
          required: true
          description: Unique match identifier
          schema:
            type: integer
            example: 2804405
      responses:
        '200':
          description: H2H data retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/H2HResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /match/{match_id}/odds:
    get:
      tags:
        - Matches
      summary: Get match odds
      description: |
        Get detailed odds information including:
        - Corner odds (corner betting markets)
        - Correct score odds (exact score predictions)
        - Double chance odds (combined outcome betting)
        - First half odds (half-time betting markets)
        - Odds comparison from multiple bookmakers

        **Cache TTL:** 15 minutes
      operationId: getMatchOdds
      x-cache-ttl: 900
      parameters:
        - name: match_id
          in: path
          required: true
          description: Unique match identifier
          schema:
            type: integer
            example: 2804405
      responses:
        '200':
          description: Odds data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OddsResponse'
        '404':
          description: Odds not available for this match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /matches/date/{date}:
    get:
      tags:
        - Matches
      summary: Get matches by date
      description: |
        Get all matches for a specific date, organized by league.

        **Cache TTL:**
        - Today / future dates: 5 minutes
        - Past dates: 24 hours
      operationId: getMatchesByDate
      x-cache-ttl:
        today: 300
        past: 86400
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
            example: "2026-02-19"
        - name: sort_by_time
          in: query
          required: false
          description: Sort matches chronologically by match time
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Matches retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateMatchesResponse'
              example:
                success: true
                data:
                  date: "2026-02-19"
                  total_matches: 42
                  matches:
                    - match_id: 2804405
                      home_team: "Arsenal"
                      away_team: "Chelsea"
                      home_score: null
                      away_score: null
                      match_time: "2026-02-19T20:00:00Z"
                      status: "scheduled"
                      league_id: 1
                      league_name: "England Premier League"
                  leagues:
                    "1":
                      league_name: "England Premier League"
                      league_code: "premier-league"
                      match_count: 5
        '400':
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid date format. Use YYYY-MM-DD"
                status_code: 400
                success: false
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /matches/today:
    get:
      tags:
        - Matches
      summary: Get today's matches
      description: Shortcut for `/matches/date/{today}`. Cache TTL: 5 minutes.
      operationId: getTodayMatches
      x-cache-ttl: 300
      parameters:
        - name: sort_by_time
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Today's matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateMatchesResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /matches/tomorrow:
    get:
      tags:
        - Matches
      summary: Get tomorrow's matches
      description: Shortcut for `/matches/date/{tomorrow}`. Cache TTL: 5 minutes.
      operationId: getTomorrowMatches
      x-cache-ttl: 300
      parameters:
        - name: sort_by_time
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Tomorrow's matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateMatchesResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /matches/yesterday:
    get:
      tags:
        - Matches
      summary: Get yesterday's matches
      description: Shortcut for `/matches/date/{yesterday}`. Cache TTL: 24 hours (historical data).
      operationId: getYesterdayMatches
      x-cache-ttl: 86400
      parameters:
        - name: sort_by_time
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Yesterday's matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateMatchesResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ============================================================================
  # LIVE MATCH ENDPOINTS
  # ============================================================================
  /matches/live:
    get:
      tags:
        - Live
      summary: Get all live matches
      description: |
        Get all currently live matches with real-time statistics and odds.
        Also includes matches starting within the next 2 hours (upcoming).

        **Cache TTL:** 30 seconds

        **Data sources:**
        - Match list: `bf_en-idn.js`
        - Technical stats: `detail.js`
        - Live odds (Bet365): `runOddsData_8.txt`
        - Corner stats: `sbCorner.js`
      operationId: getLiveMatches
      x-cache-ttl: 30
      parameters:
        - name: include_stats
          in: query
          description: Include technical statistics (shots, possession, etc.)
          schema:
            type: boolean
            default: true
        - name: include_odds
          in: query
          description: Include live Bet365 odds (Asian Handicap, 1X2, O/U)
          schema:
            type: boolean
            default: true
        - name: include_corners
          in: query
          description: Include corner statistics. Adds extra upstream call.
          schema:
            type: boolean
            default: false
        - name: league_id
          in: query
          description: Filter results to a specific league
          schema:
            type: integer
            example: 1
        - name: only_live
          in: query
          description: |
            When `true`, returns only matches currently in play.
            When `false` (default), also includes upcoming matches (next 2 hours).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Live matches retrieved successfully
          headers:
            X-Cache-TTL:
              description: Cache TTL in seconds (30)
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveMatchesResponse'
              example:
                success: true
                data:
                  matches:
                    - match_id: 2804405
                      home_team: "Arsenal"
                      away_team: "Chelsea"
                      home_score: 1
                      away_score: 0
                      minute: 67
                      is_live: true
                      status: "2H"
                      league_id: 1
                      league_name: "England Premier League"
                      stats:
                        possession:
                          home: 55
                          away: 45
                        shots:
                          home: 8
                          away: 5
                      odds:
                        asian_handicap:
                          home: 1.85
                          line: -0.5
                          away: 2.05
                  meta:
                    total_matches: 15
                    live_count: 12
                    last_update: "2026-02-19T10:00:00Z"
                    cache_ttl: 30
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /matches/live/{match_id}:
    get:
      tags:
        - Live
      summary: Get live match details
      description: |
        Get complete live data for a specific match including stats, odds, and events.

        **Cache TTL:** 30 seconds
      operationId: getLiveMatchDetails
      x-cache-ttl: 30
      parameters:
        - name: match_id
          in: path
          required: true
          description: Match identifier
          schema:
            type: integer
            example: 2804405
      responses:
        '200':
          description: Live match details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveMatchDetailResponse'
        '404':
          description: Match not found or not currently live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /matches/live/{match_id}/stats:
    get:
      tags:
        - Live
      summary: Get live match statistics
      description: |
        Technical statistics for a specific live match:
        - Shots (total, on target, off target)
        - Ball possession (%)
        - Corners
        - Fouls
        - Yellow / Red cards
        - Attacks & Dangerous attacks
        - Passes & Pass accuracy

        **Cache TTL:** 30 seconds
      operationId: getLiveMatchStats
      x-cache-ttl: 30
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
            example: 2804405
      responses:
        '200':
          description: Live match statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStatsResponse'
              example:
                success: true
                data:
                  match_id: 2804405
                  cache_ttl: 30
                  stats:
                    possession:
                      home: 55
                      away: 45
                    shots:
                      home: 8
                      away: 5
                    shots_on_target:
                      home: 3
                      away: 2
                    corners:
                      home: 4
                      away: 2
                    fouls:
                      home: 7
                      away: 9
                    yellow_cards:
                      home: 1
                      away: 2
                    red_cards:
                      home: 0
                      away: 0
                    attacks:
                      home: 45
                      away: 38
                    dangerous_attacks:
                      home: 18
                      away: 12
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /matches/live/{match_id}/odds:
    get:
      tags:
        - Live
      summary: Get live match odds
      description: |
        Live odds from **Bet365** for a specific match:
        - Asian Handicap (home, line, away)
        - Match Result 1X2 (home, draw, away)
        - Over/Under goals (over, line, under)
        - Both Teams to Score (yes/no)
        - Double Chance

        **Cache TTL:** 15 seconds (odds change frequently)
      operationId: getLiveMatchOdds
      x-cache-ttl: 15
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
            example: 2804405
      responses:
        '200':
          description: Live odds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveOddsResponse'
              example:
                success: true
                data:
                  match_id: 2804405
                  bookmaker: "Bet365"
                  cache_ttl: 15
                  odds:
                    asian_handicap:
                      home: 1.85
                      line: -0.5
                      away: 2.05
                    match_result:
                      home: 1.60
                      draw: 3.80
                      away: 5.50
                    over_under:
                      over: 2.10
                      line: 2.5
                      under: 1.75
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /matches/live/{match_id}/corners:
    get:
      tags:
        - Live
      summary: Get live match corner statistics
      description: |
        Corner statistics for a specific live match:
        - Total corners (home / away)
        - First half corners
        - Corner betting odds (over/under, handicap)

        **Cache TTL:** 30 seconds
      operationId: getLiveMatchCorners
      x-cache-ttl: 30
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
            example: 2804405
      responses:
        '200':
          description: Corner statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCornersResponse'
              example:
                success: true
                data:
                  match_id: 2804405
                  cache_ttl: 30
                  corners:
                    total:
                      home: 4
                      away: 2
                    first_half:
                      home: 2
                      away: 1
                    odds:
                      over_under:
                        line: 9.5
                        over: 1.90
                        under: 1.90
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /matches/live/{match_id}/events:
    get:
      tags:
        - Live
      summary: Get live match events
      description: |
        Timeline of match events for a specific live match:
        - Goals (including own goals, penalties)
        - Yellow / Red cards
        - Substitutions
        - VAR decisions

        **Cache TTL:** 30 seconds
      operationId: getLiveMatchEvents
      x-cache-ttl: 30
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
            example: 2804405
      responses:
        '200':
          description: Match events timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveEventsResponse'
              example:
                success: true
                data:
                  match_id: 2804405
                  cache_ttl: 30
                  events:
                    - minute: 23
                      type: "goal"
                      team: "home"
                      player: "Saka"
                      assist: "Odegaard"
                      score: "1-0"
                    - minute: 45
                      type: "yellow_card"
                      team: "away"
                      player: "Reece James"
                    - minute: 67
                      type: "substitution"
                      team: "home"
                      player: "Martinelli"
                      assist: "Nketiah"
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ============================================================================
  # LEAGUE LIST ENDPOINTS
  # ============================================================================
  /leagues:
    get:
      tags:
        - Leagues
      summary: Get leagues from today's matches
      description: |
        Returns leagues that have at least one match today.
        Data is derived from today's match feed (not static JSON).

        **Cache TTL:** 5 minutes (same as today's matches)
      operationId: getLeagues
      x-cache-ttl: 300
      responses:
        '200':
          description: Leagues with today's matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaguesListResponse'
              example:
                success: true
                data:
                  count: 12
                  leagues:
                    - id: "1"
                      name: "England Premier League"
                      code: "premier-league"
                    - id: "36"
                      name: "Turkey Super Lig"
                      code: "super-lig"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /leagues/all:
    get:
      tags:
        - Leagues
      summary: Get all available leagues
      description: |
        Returns all leagues from the static database (`data/leagues.json`).
        No upstream call — instant response.

        Organized by country with optional filters.
      operationId: getAllLeagues
      parameters:
        - name: country
          in: query
          description: Filter by country slug (e.g., `england`, `turkey`, `spain`)
          schema:
            type: string
            example: "england"
        - name: type
          in: query
          description: Filter by league type
          schema:
            type: string
            enum: [league, subleague, cup]
            example: "league"
      responses:
        '200':
          description: All leagues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllLeaguesResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /leagues/top:
    get:
      tags:
        - Leagues
      summary: Get top/popular leagues
      description: |
        Returns top leagues (Big 5 + others) and major cups from static data.
        No upstream call — instant response.
      operationId: getTopLeagues
      responses:
        '200':
          description: Top leagues and major cups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopLeaguesResponse'
              example:
                success: true
                data:
                  count: 10
                  top_leagues:
                    - id: 1
                      name: "England Premier League"
                      code: "premier-league"
                      country: "england"
                      type: "league"
                    - id: 4
                      name: "Spain La Liga"
                      code: "la-liga"
                      country: "spain"
                      type: "league"
                  major_cups:
                    - id: 100
                      name: "UEFA Champions League"
                      code: "champions-league"
                      type: "cup"
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /leagues/countries:
    get:
      tags:
        - Leagues
      summary: Get list of countries with leagues
      description: Returns all countries that have at least one league in the database, sorted by league count.
      operationId: getCountries
      responses:
        '200':
          description: Countries with league counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'
              example:
                success: true
                data:
                  count: 85
                  countries:
                    - code: "england"
                      name: "England"
                      league_count: 8
                    - code: "germany"
                      name: "Germany"
                      league_count: 6
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /leagues/{league_id}/lookup:
    get:
      tags:
        - Leagues
      summary: Lookup league by ID
      description: |
        Look up a league by its numeric ID in the static database.
        Returns the league object and which section it was found in.
      operationId: lookupLeague
      parameters:
        - name: league_id
          in: path
          required: true
          description: League numeric ID
          schema:
            type: integer
            example: 36
      responses:
        '200':
          description: League found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueLookupResponse'
              example:
                success: true
                data:
                  found_in: "leagues.turkey"
                  league:
                    id: 36
                    name: "Turkey Super Lig"
                    code: "super-lig"
                    country: "turkey"
                    type: "league"
        '404':
          description: League not found in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ============================================================================
