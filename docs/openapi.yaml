          required: true
          schema:
            type: integer
            example: 36
        - name: season
          in: query
          required: true
          description: Season identifier
          schema:
            type: string
            example: "2024-2025"
        - name: round
          in: query
          required: false
          description: Filter to a specific round number. Omit for all rounds.
